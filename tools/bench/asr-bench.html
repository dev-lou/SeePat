<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>SeePat ASR bench</title>
    <style>
      body { font: 13px/1.5 "Cascadia Mono", Consolas, monospace; background: #0b1020; color: #dfe7f7; padding: 16px; }
      pre { white-space: pre-wrap; margin: 0; }
    </style>
  </head>
  <body>
    <pre id="log">bench loaded — waiting for a plan</pre>
    <script type="module">
      /*
       * The model bench.
       *
       * This exists because "the offline model is weak on Tagalog" and "the offline
       * model is broken" are different claims, and the app's own comments assert
       * the first without a number behind it. So this page runs the *real* pipeline
       * — same library version, same call options as `transcribeOffline` in
       * `src/asr-offline.ts`, and the app's own silence gate imported from
       * `src/audio.ts` rather than re-implemented — over real recordings with known
       * transcripts, and reports what came out.
       *
       * It is driven over CDP by `tools/bench-asr.mjs`, which owns the audio files,
       * the references, and the word-error-rate maths. The page owns only the part
       * that must run in a browser: ONNX Runtime Web.
       *
       * Deliberate difference from production, and the only one: `proxy` is off.
       * Production moves the ONNX session into a worker; the bench keeps it in the
       * page so a single CDP `Runtime.evaluate` can await the whole run and read the
       * results back. That changes threading, not arithmetic — accuracy is
       * unaffected, and the timings are labelled as page-thread timings.
       */
      import { pipeline, env } from '@huggingface/transformers'
      import { normalisePeak, speechDurationMs, TARGET_SAMPLE_RATE } from '/src/audio.ts'

      const logEl = document.getElementById('log')
      const log = (message) => {
        logEl.textContent += `\n${message}`
        console.log(`[bench] ${message}`)
      }

      env.useBrowserCache = true
      env.allowLocalModels = false
      const wasm = env.backends?.onnx?.wasm
      if (wasm) wasm.proxy = false

      /** Which files the Hub actually served us — evidence of the dtype in use. */
      const loadedFiles = new Map()
      const pipelines = new Map()

      /**
       * Load a model, retrying a dropped connection.
       *
       * Weights are hundreds of megabytes over a consumer link, and a single
       * interrupted response used to fail the whole run — measured here as
       * `TypeError: Failed to fetch` after 467MB of a two-model download. A retry
       * resumes from the browser cache (the partially fetched files are re-read
       * from disk), so a transient drop costs seconds rather than the whole run.
       */
      async function getPipeline(repo) {
        const existing = pipelines.get(repo)
        if (existing) return existing
        const load = async () => {
          let lastError = null
          for (let attempt = 1; attempt <= 3; attempt += 1) {
            try {
              return await pipeline('automatic-speech-recognition', repo, {
                progress_callback: (event) => {
                  if (event?.status === 'progress' && event.name) {
                    const set = loadedFiles.get(repo) ?? new Set()
                    set.add(event.name)
                    loadedFiles.set(repo, set)
                  }
                  if (event?.status === 'ready') log(`loaded: ${repo}`)
                },
              })
            } catch (error) {
              lastError = error
              log(`load attempt ${attempt} failed for ${repo}: ${String(error?.message ?? error)}`)
              await new Promise((r) => setTimeout(r, 1500 * attempt))
            }
          }
          throw lastError ?? new Error(`could not load ${repo}`)
        }
        const promise = load()
        // A failed load must not be cached as a permanent one.
        promise.catch(() => pipelines.delete(repo))
        pipelines.set(repo, promise)
        return promise
      }

      /**
       * Fetch a WAV and hand back 16 kHz mono float samples.
       *
       * Rendered through an OfflineAudioContext exactly the way `toMono16k` in
       * `src/audio.ts` does it, because `decodeAudioData` resamples to the
       * *context* rate — decoding into a default 48 kHz context and passing the
       * result to Whisper would be the "wrong sample rate" bug the production file
       * is careful to avoid, and the bench must not have a different input path
       * from the product or it would be measuring itself.
       */
      async function decode16k(url) {
        let response
        try {
          response = await fetch(url)
        } catch (error) {
          throw new Error(`clip fetch failed (${url}): ${String(error?.message ?? error)}`)
        }
        if (!response.ok) throw new Error(`clip fetch ${response.status} (${url})`)
        const bytes = await response.arrayBuffer()
        const decoder = new AudioContext()
        const decoded = await decoder.decodeAudioData(bytes)
        void decoder.close()

        const frames = Math.max(1, Math.ceil(decoded.duration * TARGET_SAMPLE_RATE))
        const offline = new OfflineAudioContext(1, frames, TARGET_SAMPLE_RATE)
        const source = offline.createBufferSource()
        source.buffer = decoded
        source.connect(offline.destination)
        source.start()
        const rendered = await offline.startRendering()
        return rendered.getChannelData(0).slice()
      }

      function scaled(samples, gain) {
        const out = new Float32Array(samples.length)
        for (let i = 0; i < samples.length; i += 1) out[i] = samples[i] * gain
        return out
      }

      function levels(samples) {
        let sum = 0
        let peak = 0
        for (let i = 0; i < samples.length; i += 1) {
          sum += samples[i] * samples[i]
          peak = Math.max(peak, Math.abs(samples[i]))
        }
        return { rms: Math.sqrt(sum / Math.max(1, samples.length)), peak }
      }

      /**
       * `quiet` is a phone held at arm's length, or a browser that ignored
       * `autoGainControl` — the recording the app's fixed 0.02 RMS gate was
       * measured against on a desktop. `quiet+normalized` is the same recording
       * after the software gain a production fix would apply.
       */
      function applyVariant(samples, variant) {
        if (variant === 'quiet') return scaled(samples, 0.1)
        /*
         * `quiet-normalized` and `normalized` call the app's own `normalisePeak`
         * rather than a copy of it. The whole question is what the *shipped* rule
         * does to these recordings — including its threshold, which is what stage 3
         * changed — so the bench must not carry its own idea of the right answer.
         */
        if (variant === 'quiet-normalized') return normalisePeak(scaled(samples, 0.1))
        if (variant === 'normalized') return normalisePeak(samples)
        return samples
      }

      async function run(plan) {
        const decoded = new Map()
        const results = []

        // Warm each model once, the way `installVoiceModel` does, so the first
        // measured clip is not paying session-creation cost.
        for (const repo of plan.models) {
          const pipe = await getPipeline(repo)
          await pipe(new Float32Array(8000), { language: plan.langs[0] ?? null, task: 'transcribe' })
          log(`warm: ${repo}`)
        }

        for (const clip of plan.clips) {
          if (!decoded.has(clip.id)) decoded.set(clip.id, await decode16k(clip.url))
          const base = decoded.get(clip.id)

          for (const variant of plan.variants) {
            const samples = applyVariant(base, variant)
            const { rms, peak } = levels(samples)
            // The app's real gate, imported — so the report can say whether the
            // production guard would have refused this audio before the model.
            const gateMs = speechDurationMs(samples)

            for (const repo of plan.models) {
              const pipe = await getPipeline(repo)
              for (const lang of plan.langs) {
                const started = performance.now()
                let text = ''
                let error = null
                try {
                  // Mirrors `transcribeOffline` in src/asr-offline.ts: short takes
                  // go through in one pass (chunking a 1–2s clip only pads it
                  // into hallucination); the `lang` axis still forces chunking
                  // off so each language setting is compared on the same path.
                  const short = samples.length / TARGET_SAMPLE_RATE <= 15
                  const output = await pipe(samples, {
                    // `null` is the library's own default and means "detect";
                    // the app passes a hard-coded 'tl' here (see asr-offline.ts).
                    language: lang === 'auto' ? null : lang,
                    task: 'transcribe',
                    ...(short ? {} : { chunk_length_s: 30, stride_length_s: 5 }),
                  })
                  text = Array.isArray(output) ? output.map((o) => o.text).join(' ') : output.text
                } catch (caught) {
                  error = String(caught?.message ?? caught)
                }
                const ms = Math.round(performance.now() - started)
                results.push({
                  clip: clip.id,
                  ref: clip.ref,
                  variant,
                  model: repo,
                  lang,
                  text: text.trim(),
                  error,
                  ms,
                  gateMs,
                  rms,
                  peak,
                })
                log(
                  `${clip.id} ${variant} ${repo.split('/').pop()} lang=${lang} ${ms}ms gate=${gateMs}ms → ${(text || error || '').slice(0, 110)}`,
                )
              }
            }
          }
        }

        return {
          results,
          files: Object.fromEntries([...loadedFiles].map(([repo, set]) => [repo, [...set]])),
          hardwareConcurrency: navigator.hardwareConcurrency,
          userAgent: navigator.userAgent,
        }
      }

      window.__BENCH = { run, version: 1 }
      log('bench ready')
    </script>
  </body>
</html>
